<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>

    <body>
        <script>

            var a=Number(prompt("a:"));
            var b=Number(prompt("b:"));

            var topla=a+b;
            var cikar=a-b;
            var carp=a*b;
            var bol=a/b;
            var mod=a%b;

            alert("toplam: " + topla + "çıkarma: " + cikar + "çarpım: " + carp + "bölme:" + bol + " mod: " + mod )

        </script>
    </body>
</html>
