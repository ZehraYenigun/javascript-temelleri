
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hesap Makinesi</title>

    <style>
        body {
            background-color: #eeeeee;
            font-family: Arial;
        }

        .hesap {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        #ekran {
            width: 100%;
            height: 50px;
            margin-bottom: 15px;
            font-size: 25px;
            text-align: right;
            box-sizing: border-box;
        }

        .butonlar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            height: 50px;
            font-size: 20px;
            border: none;
            border-radius: 5px;
            background-color: #dddddd;
            cursor: pointer;
        }

        button:hover {
            background-color: #bbbbbb;
        }

        .islem {
            background-color: orange;
            color: white;
        }

        .temizle {
            background-color: #e74c3c;
            color: white;
        }

        .esittir {
            background-color: #3498db;
            color: white;
        }
    </style>

</head>

<body>

    <div class="hesap">

        <h2>Hesap Makinesi</h2>

        <input type="text" id="ekran" readonly>

        <div class="butonlar">

            <button onclick="ekle('7')">7</button>
            <button onclick="ekle('8')">8</button>
            <button onclick="ekle('9')">9</button>
            <button class="islem" onclick="ekle('/')">/</button>

            <button onclick="ekle('4')">4</button>
            <button onclick="ekle('5')">5</button>
            <button onclick="ekle('6')">6</button>
            <button class="islem" onclick="ekle('*')">*</button>

            <button onclick="ekle('1')">1</button>
            <button onclick="ekle('2')">2</button>
            <button onclick="ekle('3')">3</button>
            <button class="islem" onclick="ekle('-')">-</button>

            <button onclick="ekle('0')">0</button>
            <button onclick="ekle('.')">.</button>
            <button class="esittir" onclick="hesapla()">=</button>
            <button class="islem" onclick="ekle('+')">+</button>

            <button class="temizle" onclick="temizle()" style="grid-column: span 4;">C</button>

        </div>

    </div>

    <script>

        function ekle(deger) {
            document.getElementById("ekran").value += deger;
        }

        function temizle() {
            document.getElementById("ekran").value = "";
        }

        function hesapla() {

            var sonuc = document.getElementById("ekran").value;

            try {
                document.getElementById("ekran").value = eval(sonuc);
            }
            catch {
                document.getElementById("ekran").value = "Hata";
            }

        }

    </script>

</body>
</html>
