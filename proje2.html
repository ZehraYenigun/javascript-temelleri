
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hesap Makinesi</title>

    <style>
        body {
            background-color: #eeeeee;
            font-family: Arial;
        }

        .hesap {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }

        h2 {
            color: #333;
        }

        button {
            width: 100px;
            height: 45px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #217dbb;
        }

        #sonuc {
            margin-top: 20px;
            font-size: 20px;
            color: #333;
        }
    </style>

</head>

<body>

    <div class="hesap">

        <h2>Hesap Makinesi</h2>

        <button onclick="topla()">Toplama (+)</button>
        <button onclick="cikar()">Çıkarma (-)</button>
        <button onclick="carp()">Çarpma (*)</button>
        <button onclick="bol()">Bölme (/)</button>

        <p id="sonuc">Sonuç: </p>

    </div>

    <script>

        var sayi1 = Number(prompt("Birinci sayıyı giriniz:"));
        var sayi2 = Number(prompt("İkinci sayıyı giriniz:"));

        function topla() {
            var toplam = sayi1 + sayi2;
            document.getElementById("sonuc").innerHTML = "Sonuç: " + toplam;
        }

        function cikar() {
            var cikarma = sayi1 - sayi2;
            document.getElementById("sonuc").innerHTML = "Sonuç: " + cikarma;
        }

        function carp() {
            var carpma = sayi1 * sayi2;
            document.getElementById("sonuc").innerHTML = "Sonuç: " + carpma;
        }

        function bol() {
            var bolme = sayi1 / sayi2;
            document.getElementById("sonuc").innerHTML = "Sonuç: " + bolme;
        }

    </script>

</body>
</html>
