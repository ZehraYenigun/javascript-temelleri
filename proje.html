<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hesap Makinesi</title>
</head>

<body>

    <h2>Basit Hesap Makinesi</h2>

    <script>

        var sayi1 = Number(prompt("Birinci sayıyı giriniz:"));
        var sayi2 = Number(prompt("İkinci sayıyı giriniz:"));

        var toplam = sayi1 + sayi2;
        var cikarma = sayi1 - sayi2;
        var carpma = sayi1 * sayi2;
        var bolme = sayi1 / sayi2;

        document.write("Toplama: " + toplam + "<br>");
        document.write("Çıkarma: " + cikarma + "<br>");
        document.write("Çarpma: " + carpma + "<br>");
        document.write("Bölme: " + bolme);

    </script>

</body>
</html>
