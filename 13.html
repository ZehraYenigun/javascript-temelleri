<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>

    <body>
        <script>

            var a=2;
            document.write(++a);
            document.write("<br>");
            document.write(a);
            document.write("<br>");
            
            var b=4;
            document.write(b--);
            document.write("<br>");
            document.write(b);

        </script>
    </body>
</html>
